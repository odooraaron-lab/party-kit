<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table cards for the storybook</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500&family=Grandstander:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
/* Table tents: one per A4 sheet. Fold along the middle and stand it up;
   the top half is printed upside down so both sides read the right way up. */
@page{size:A4 portrait;margin:0}
html,body{background:#E9E4F0;margin:0}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding:14px;background:#fff;border-bottom:2px solid #E0D8EA;font-family:Nunito,system-ui,sans-serif;color:#3B2A4A}
.bar label{font-weight:800}
.bar select{font:inherit;padding:8px 10px;border-radius:10px;border:2px solid #D8CFE6}
.bar .hint{font-size:14px;color:#5E4C70;flex-basis:100%;text-align:center}
.pages{display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 0}
.tent{width:210mm;height:297mm;background:#fff;box-shadow:0 6px 24px rgba(46,33,64,.18);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tent .face:first-child{transform:rotate(180deg)}
.fold{position:absolute;left:0;right:0;top:148.5mm;height:0;border-top:.4mm dashed #B9AECB;z-index:3}
.fold span{position:absolute;right:4mm;top:-5mm;font:700 7pt Nunito,sans-serif;color:#9A8FAE;background:#fff;padding:0 1.5mm}

.face{width:210mm;height:148.5mm;display:grid;grid-template-columns:96mm 1fr;box-sizing:border-box;padding:7mm;gap:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.scan{background:#fff;border:.8mm solid #3B2A4A;border-right:0;border-radius:6mm 0 0 6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5mm 4mm;text-align:center}
.scan h2{font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:30pt;line-height:1;margin:0 0 3mm;color:#3B2A4A;letter-spacing:-.01em;display:flex;align-items:center;gap:2.5mm}
.scan h2 svg{width:10mm;height:10mm}
.scan .qr{width:74mm;height:74mm;padding:2.5mm;border:.8mm solid #3B2A4A;border-radius:4mm;background:#fff;box-sizing:border-box}
.scan .qr img{width:100%;height:100%;display:block}
.scan p{margin:3.5mm 0 0;font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:11pt;line-height:1.25;color:#5E4C70;max-width:80mm;overflow-wrap:anywhere}

.art{position:relative;overflow:hidden;border:.8mm solid #3B2A4A;border-radius:0 6mm 6mm 0;background:linear-gradient(var(--sky-high),var(--sky) 62%)}
.art .star{position:absolute;width:1.4mm;height:1.4mm;border-radius:50%;background:#FFF3C4}
.art .bunting{position:absolute;left:-2mm;right:-2mm;top:0;height:14mm}
.art .moon{position:absolute;right:7mm;top:15mm;width:19mm;height:19mm;border-radius:50%;background:#FBE7A1;border:.6mm solid #3B2A4A;box-shadow:0 0 0 3mm rgba(255,243,196,.35)}
.art .jumper{position:absolute;right:13mm;top:9mm;width:34mm;transform:rotate(-10deg)}
.art .hills{position:absolute;left:0;right:0;bottom:0;height:40mm}
.art .words{position:absolute;left:6mm;right:6mm;top:37mm;text-align:center;color:var(--ink)}
.art .happy{font-family:var(--story);font-style:italic;font-size:15pt;line-height:1;margin:0}
.art .name{font-family:var(--display);font-weight:800;line-height:.95;margin:1.5mm 0 1.5mm;overflow-wrap:anywhere;text-shadow:0 .8mm 0 rgba(255,255,255,.35)}
.art .which{display:inline-block;font-family:var(--display);font-weight:800;font-size:13pt;line-height:1;margin:0;padding:2mm 4.5mm;border-radius:99px;background:#FFC857;color:#3B2A4A;border:.6mm solid #3B2A4A}
.art .c1{position:absolute;left:4mm;bottom:3mm;width:25mm}
.art .c2{position:absolute;left:30mm;bottom:2mm;width:23mm}
.art .c3{position:absolute;right:4mm;bottom:3mm;width:22mm}
.art svg{display:block;width:100%;height:auto;overflow:visible}

@media print{
  html,body{background:#fff}
  .bar{display:none}
  .pages{padding:0;gap:0}
  .tent{box-shadow:none;break-after:page}
  .fold span{display:none}
}
</style>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon">
</head>
<body>
<div class="bar">
  <label for="count">Tables</label>
  <select id="count"></select>
  <button class="btn btn-main" style="width:auto" onclick="window.print()">Print table cards</button>
  <span class="hint">One card per A4 sheet. Print on thick paper or card if you can, fold along the dotted line, and stand it on the table.</span>
</div>
<div class="pages" id="pages"></div>

<template id="face">
  <div class="face">
    <div class="scan">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3" fill="#AFCBF2" stroke="#3B2A4A" stroke-width="2"/><path d="M8.5 6l1.5-2.5h4L15.5 6" fill="none" stroke="#3B2A4A" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="#fff" stroke="#3B2A4A" stroke-width="2"/></svg>Scan here</h2>
      <div class="qr"><img src="/api/qr.svg" alt="QR code"></div>
      <p class="line"></p>
    </div>
    <div class="art">
      <div class="bunting"></div>
      <div class="moon"></div>
      <div class="jumper"></div>
      <div class="hills"></div>
      <div class="words">
        <p class="happy">Happy</p>
        <p class="name"></p>
        <p class="which"></p>
      </div>
      <div class="c1"></div><div class="c2"></div><div class="c3"></div>
    </div>
  </div>
</template>

<script src="/shared.js"></script>
<script>
(function(){
  const BUNT = ["#C23A64","#FFC857","#AFCBF2","#8FD3B6","#B58BD8"];
  const bunting = '<svg viewBox="0 0 230 30" preserveAspectRatio="none"><path d="M0 4 Q115 26 230 4" fill="none" stroke="#3B2A4A" stroke-width="1.2"/>' +
    Array.from({length: 11}, (_, i) => { const x = 6 + i * 20.5, y = 4 + Math.sin((x / 230) * Math.PI) * 10; return '<path d="M' + x + ' ' + y + 'h13l-6.5 12z" fill="' + BUNT[i % 5] + '" stroke="#3B2A4A" stroke-width="1" stroke-linejoin="round"/>'; }).join("") + '</svg>';
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);

  // Big name, smaller as names get longer, so "Ari" and "Alexandria" both fit.
  function nameSize(n){ const L = n.length; return (L <= 4 ? 64 : L <= 6 ? 54 : L <= 8 ? 44 : L <= 11 ? 36 : L <= 15 ? 28 : 22) + "pt"; }

  function face(s){
    const f = document.getElementById("face").content.cloneNode(true);
    const name = (s.name || "").trim() || "Birthday star";
    f.querySelector(".line").textContent = N18.t("cardTitle");
    f.querySelector(".name").textContent = name;
    f.querySelector(".name").style.fontSize = nameSize(name);
    const bw = N18.birthdayWord(s);
    f.querySelector(".which").textContent = bw === "birthday" ? "Birthday!" : cap(bw) + "!";
    f.querySelector(".bunting").innerHTML = bunting;
    f.querySelector(".jumper").innerHTML = N18.COW;
    f.querySelector(".hills").innerHTML = N18.hills("xMidYMax slice");
    f.querySelector(".c1").innerHTML = N18.DOG;
    f.querySelector(".c2").innerHTML = N18.CAT;
    f.querySelector(".c3").innerHTML = N18.HUMPTY;
    if(document.documentElement.dataset.theme === "dark"){
      const art = f.querySelector(".art");
      [[12,22],[30,14],[52,30],[70,18],[22,44],[88,40],[60,50]].forEach(([x,y]) => { const d = document.createElement("span"); d.className = "star"; d.style.left = x + "mm"; d.style.top = y + "mm"; art.appendChild(d); });
    }
    return f;
  }

  function render(s, count){
    const pages = document.getElementById("pages");
    pages.replaceChildren();
    for(let i = 0; i < count; i++){
      const t = document.createElement("div"); t.className = "tent";
      t.append(face(s), face(s));
      t.insertAdjacentHTML("beforeend", '<div class="fold"><span>fold</span></div>');
      pages.append(t);
    }
  }

  const sel = document.getElementById("count");
  for(let i = 1; i <= 12; i++) sel.append(new Option(i + (i === 1 ? " table" : " tables"), i));
  sel.value = "4";
  fetch("/api/settings").then(r => r.json()).catch(() => ({})).then(s => {
    N18.apply(s || {});
    document.title = "Table cards for " + ((s && s.name) || "the party");
    render(s || {}, 4);
    sel.addEventListener("change", () => render(s || {}, Number(sel.value)));
  });
})();
</script>
</body>
</html>
