<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The storybook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Grandstander:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
/* One unit that fits any screen shape: 1u = 1% of a 16:9 box that fits the screen. */
html,body{height:100%;overflow:hidden}
.tv{--u:min(1vw,1.7778vh);position:relative;height:100%;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) calc(24*var(--u));grid-template-rows:auto minmax(0,1fr) calc(11*var(--u));
  column-gap:calc(3*var(--u));row-gap:calc(1.8*var(--u));padding:calc(2.4*var(--u)) calc(3.5*var(--u)) calc(1.6*var(--u))}
.sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.sky .cloud{height:calc(2.4*var(--u))}
.sky .c1{width:calc(11*var(--u));top:calc(1.5*var(--u));left:44%;animation:drift 90s linear infinite}
.sky .c2{width:calc(7*var(--u));top:calc(.8*var(--u));left:68%;animation:drift 120s linear infinite reverse}
.ground{position:absolute;left:0;right:0;bottom:0;height:30vh;pointer-events:none;z-index:0}

/* header */
.head{grid-column:1;grid-row:1;position:relative;z-index:1;min-width:0}
.title{font-family:var(--display);font-weight:800;font-size:calc(4.4*var(--u));line-height:1.05;margin:0;color:var(--ink);text-shadow:0 calc(.3*var(--u)) 0 rgba(59,42,74,.12)}
.sub{font-family:var(--story);font-size:calc(1.55*var(--u));line-height:1.4;color:var(--ink-soft);margin:calc(.6*var(--u)) 0 0;font-weight:500;max-width:calc(80*var(--u))}
.moonbox{position:absolute;top:calc(1.4*var(--u));right:calc(4.5*var(--u));z-index:3;width:calc(9.5*var(--u));height:calc(9.5*var(--u))}
.moonbox .moon{position:absolute;inset:0;border-width:calc(.3*var(--u));display:grid;place-items:center;text-align:center;box-shadow:0 0 0 calc(1.2*var(--u)) rgba(255,255,255,.28);z-index:1}
.moonbox::before{content:"";position:absolute;inset:calc(-1.8*var(--u));border-radius:50%;background:rgba(255,255,255,.18);animation:glow 5s ease-in-out infinite;will-change:transform,opacity}
@keyframes glow{50%{transform:scale(.9);opacity:.4}}
.moonbox b{display:block;font-family:var(--display);font-weight:800;font-size:calc(3.6*var(--u));line-height:1;color:#3B2A4A}
.moonbox span{display:block;font-size:calc(1*var(--u));font-weight:800;color:#3B2A4A;margin-top:calc(.2*var(--u))}
.moonbox.bump b{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.4)}}
.moonbox .cow{width:calc(10.5*var(--u));left:calc(-.5*var(--u));top:calc(-1*var(--u));z-index:4}
.diddle{top:calc(-3.2*var(--u));right:calc(10.5*var(--u));font-size:calc(1.3*var(--u));border-width:calc(.2*var(--u))}

/* the open book */
.book-wrap{grid-column:1;grid-row:2;position:relative;z-index:2;min-height:0;perspective:calc(180*var(--u));display:flex;align-items:center;justify-content:center}
.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;max-width:calc(118*var(--u));max-height:calc(46*var(--u));background:#3E57A6;border:calc(.3*var(--u)) solid #3B2A4A;outline:calc(.25*var(--u)) dashed #F4C542;outline-offset:calc(-.75*var(--u));border-radius:calc(1.4*var(--u));padding:calc(1*var(--u)) calc(1*var(--u)) calc(1.8*var(--u));box-shadow:0 calc(.9*var(--u)) 0 #3B2A4A;animation:open 1s cubic-bezier(.3,1.3,.5,1) both .3s}
@keyframes open{from{opacity:0;transform:translateY(calc(4*var(--u))) rotateX(18deg)}to{opacity:1;transform:none}}
.leaf{position:relative;color:#3B2A4A;overflow:hidden;backface-visibility:hidden;min-height:0;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),repeating-linear-gradient(0deg,rgba(140,110,60,.035) 0 1px,transparent 1px 4px),#FFFBEF}
/* stacked page edges under each leaf */
.leaf-l,.leaf-r{--edge:#E8DCC2}
.book-wrap .leaf-l{box-shadow:inset calc(-2.4*var(--u)) 0 calc(2.2*var(--u)) calc(-1.4*var(--u)) rgba(120,80,40,.3),0 calc(.25*var(--u)) 0 var(--edge),0 calc(.45*var(--u)) 0 #FFFBEF,0 calc(.6*var(--u)) 0 var(--edge),0 calc(.8*var(--u)) 0 #FFFBEF}
.book-wrap .leaf-r{box-shadow:inset calc(2.4*var(--u)) 0 calc(2.2*var(--u)) calc(-1.4*var(--u)) rgba(120,80,40,.3),0 calc(.25*var(--u)) 0 var(--edge),0 calc(.45*var(--u)) 0 #FFFBEF,0 calc(.6*var(--u)) 0 var(--edge),0 calc(.8*var(--u)) 0 #FFFBEF}
.book-wrap .leaf{overflow:visible}
.leaf-inner{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
/* gold corners on the cover, a ribbon bookmark from the spine */
.corner{position:absolute;width:calc(3.4*var(--u));height:calc(3.4*var(--u));background:linear-gradient(135deg,#FFE08A,#E5A93A);border:calc(.22*var(--u)) solid #3B2A4A;z-index:1}
.corner.tl{top:calc(-.3*var(--u));left:calc(-.3*var(--u));clip-path:polygon(0 0,100% 0,0 100%);border-radius:calc(1.2*var(--u)) 0 0 0}
.corner.tr{top:calc(-.3*var(--u));right:calc(-.3*var(--u));clip-path:polygon(0 0,100% 0,100% 100%);border-radius:0 calc(1.2*var(--u)) 0 0}
.corner.bl{bottom:calc(-.3*var(--u));left:calc(-.3*var(--u));clip-path:polygon(0 0,0 100%,100% 100%);border-radius:0 0 0 calc(1.2*var(--u))}
.corner.br{bottom:calc(-.3*var(--u));right:calc(-.3*var(--u));clip-path:polygon(100% 0,0 100%,100% 100%);border-radius:0 0 calc(1.2*var(--u)) 0}
.bookmark{position:absolute;left:calc(50% + 1.2*var(--u));bottom:calc(-5.2*var(--u));width:calc(2*var(--u));height:calc(7*var(--u));background:linear-gradient(90deg,#E0607E,#F07E98 50%,#E0607E);border:calc(.2*var(--u)) solid #3B2A4A;border-top:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);transform-origin:50% 0;animation:flutter 3.5s ease-in-out infinite;z-index:0}
@keyframes flutter{50%{transform:rotate(5deg)}}
.leaf-l .leaf-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.4*var(--u));padding:calc(2.6*var(--u)) calc(2.6*var(--u)) calc(3*var(--u))}
.leaf-r .leaf-inner{display:flex;flex-direction:column;justify-content:center;padding:calc(3*var(--u)) calc(3.6*var(--u)) calc(3.4*var(--u)) calc(3.2*var(--u))}

/* the illustration plate on the left page */
.k-wish{--acc:#F2B43C} .k-advice{--acc:#5DBB8E} .k-guess{--acc:#9C84C8} .k-today{--acc:#EE7C98}
.plate{position:relative;height:min(calc(20*var(--u)),54%);width:auto;aspect-ratio:1/1;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 62%);border:calc(.3*var(--u)) solid #3B2A4A;box-shadow:0 calc(.5*var(--u)) 0 #3B2A4A, inset 0 0 0 calc(.9*var(--u)) rgba(255,255,255,.55);display:grid;place-items:center}
.plate .ring{position:absolute;inset:calc(1.3*var(--u));border-radius:50%;border:calc(.25*var(--u)) dashed var(--acc);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plate .pic{width:58%;height:58%;animation:float 4s ease-in-out infinite}
.plate .pic svg{width:100%;height:100%}
.tw{position:absolute;width:calc(2.2*var(--u));height:calc(2.2*var(--u));animation:twk 2.4s ease-in-out infinite}
.tw svg{width:100%;height:100%}
.tw.a{top:-4%;right:8%}.tw.b{bottom:4%;left:-6%;animation-delay:-.8s;width:calc(1.6*var(--u));height:calc(1.6*var(--u))}.tw.c{top:22%;left:-10%;animation-delay:-1.6s;width:calc(1.3*var(--u));height:calc(1.3*var(--u))}.tw.d{bottom:-2%;right:-4%;animation-delay:-.4s}
@keyframes twk{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.banner{position:relative;font-family:var(--display);font-weight:800;font-size:calc(1.85*var(--u));margin:0;line-height:1.1;color:#3B2A4A;background:var(--acc);border:calc(.25*var(--u)) solid #3B2A4A;padding:calc(.7*var(--u)) calc(2.4*var(--u));text-align:center;clip-path:polygon(0 0,100% 0,calc(100% - 1.2*var(--u)) 50%,100% 100%,0 100%,calc(1.2*var(--u)) 50%);max-width:100%}
.chapter-no{position:absolute;top:calc(1.8*var(--u));left:calc(2.4*var(--u));font-family:var(--display);font-weight:700;font-size:calc(1.2*var(--u));color:#8C7C9E;margin:0}

/* the message page */
.flourish{display:block;width:calc(14*var(--u));height:calc(2*var(--u));margin:calc(1.4*var(--u)) auto calc(.8*var(--u));color:var(--acc)}
.sig{margin:0;text-align:center;font-family:var(--story);font-style:italic;font-size:calc(1.5*var(--u));color:#5E4C70;line-height:1.2}
.sig b{display:block;font-style:normal;font-family:var(--display);font-weight:800;font-size:calc(2.3*var(--u));color:#3B2A4A;margin-top:calc(.2*var(--u));overflow-wrap:anywhere}
.sig b::before,.sig b::after{content:"\2665";color:var(--berry);font-size:.6em;vertical-align:.25em;margin:0 .45em}
.leaf-l{border-radius:calc(.9*var(--u)) 0 0 calc(.9*var(--u));box-shadow:inset calc(-2.2*var(--u)) 0 calc(2*var(--u)) calc(-1.4*var(--u)) rgba(120,80,40,.28);padding:calc(2.6*var(--u)) calc(2.6*var(--u)) calc(2.4*var(--u)) calc(3*var(--u));display:flex;flex-direction:column;transform-origin:right center}
.leaf-r{border-radius:0 calc(.9*var(--u)) calc(.9*var(--u)) 0;box-shadow:inset calc(2.2*var(--u)) 0 calc(2*var(--u)) calc(-1.4*var(--u)) rgba(120,80,40,.28);padding:calc(3*var(--u)) calc(3.4*var(--u)) calc(3.4*var(--u)) calc(3*var(--u));display:flex;flex-direction:column;justify-content:center;transform-origin:left center}
/* forward: right leaf lifts away, lands as the new left leaf */
.leaf-r.fwd-out{animation:rOut .45s cubic-bezier(.6,0,.8,.4) both}
.leaf-l.fwd-in{animation:lIn .5s cubic-bezier(.2,.7,.3,1) both}
/* backward: left leaf lifts away, lands as the new right leaf */
.leaf-l.back-out{animation:lOut .45s cubic-bezier(.6,0,.8,.4) both}
.leaf-r.back-in{animation:rIn .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rOut{to{transform:rotateY(-90deg)}}
@keyframes lIn{from{transform:rotateY(90deg)}to{transform:none}}
@keyframes lOut{to{transform:rotateY(90deg)}}
@keyframes rIn{from{transform:rotateY(-90deg)}to{transform:none}}

.chapter-no{font-family:var(--display);font-weight:700;font-size:calc(1.3*var(--u));color:#8C7C9E;margin:0}
.chapter-icon{width:calc(5.5*var(--u));height:calc(5.5*var(--u));margin:calc(1.2*var(--u)) 0 calc(1.2*var(--u));flex-shrink:0;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(calc(-.6*var(--u))) rotate(-3deg)}}
.chapter{font-family:var(--display);font-weight:800;font-size:calc(2.2*var(--u));line-height:1.12;margin:0;color:#3B2A4A}
.signed{margin:auto 0 0;padding-top:calc(1.2*var(--u));font-family:var(--story);font-style:italic;font-size:calc(1.6*var(--u));line-height:1.25;color:#5E4C70}
.signed b{display:block;font-style:normal;font-family:var(--display);font-weight:800;color:#3B2A4A;font-size:calc(2.1*var(--u));line-height:1.15;overflow-wrap:anywhere}

.story{font-family:var(--story);font-weight:500;font-size:calc(2.3*var(--u));line-height:1.45;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#2E2140}
.story.long{font-size:calc(1.85*var(--u))}
.story.xlong{font-size:calc(1.5*var(--u))}
.story.short{font-size:calc(3.2*var(--u));line-height:1.3;text-align:center}
/* Drop cap: sized in the same typeface so it spans exactly two lines of text */
.drop{float:left;font-family:var(--story);font-weight:700;font-size:3.02em;line-height:1;margin:-.035em .07em -.2em 0;padding:0;color:var(--acc,var(--berry));-webkit-text-stroke:.012em #3B2A4A;text-shadow:.04em .04em 0 #FFD2DC}
.page-no{position:absolute;z-index:1;bottom:calc(1.4*var(--u));right:calc(2.4*var(--u));font-family:var(--story);font-style:italic;font-size:calc(1.2*var(--u));color:#8C7C9E}
.ribbon{position:absolute;z-index:3;top:0;right:calc(3*var(--u));background:var(--berry);color:#fff;font-family:var(--display);font-weight:800;font-size:calc(1.35*var(--u));padding:calc(1.6*var(--u)) calc(1*var(--u)) calc(1.4*var(--u));border:calc(.25*var(--u)) solid #3B2A4A;border-top:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);animation:drop .7s cubic-bezier(.3,1.6,.5,1) both .1s;z-index:2}
@keyframes drop{from{transform:translateY(-110%)}}

/* page arrows */
.nav{position:absolute;top:50%;z-index:3;width:calc(5.4*var(--u));height:calc(5.4*var(--u));margin-top:calc(-2.7*var(--u));border-radius:50%;border:calc(.3*var(--u)) solid #3B2A4A;background:var(--sun);color:#3B2A4A;display:grid;place-items:center;box-shadow:0 calc(.45*var(--u)) 0 #3B2A4A;transition:transform .15s ease, box-shadow .15s ease}
.nav svg{width:55%;height:55%}
.nav:hover{transform:scale(1.08)}
.nav:active{transform:translateY(calc(.35*var(--u)));box-shadow:0 calc(.1*var(--u)) 0 #3B2A4A}
.nav.prev{left:calc(-2.2*var(--u))}
.nav.next{right:calc(-2.2*var(--u))}
.nav[hidden]{display:none}

/* Humpty Dumpty's wall, holding the QR code */
.wallbox{grid-column:2;grid-row:2 / 4;position:relative;z-index:1;display:flex;flex-direction:column;min-height:0;margin-bottom:calc(-1.6*var(--u))}
.wallbox .humpty{position:absolute;left:calc(1.6*var(--u));top:calc(-7.3*var(--u));width:calc(8.5*var(--u));z-index:2}
.wall{flex:1;border:calc(.3*var(--u)) solid #3B2A4A;border-bottom:0;border-radius:calc(.6*var(--u)) calc(.6*var(--u)) 0 0;background-size:calc(5*var(--u)) calc(2.5*var(--u));padding:calc(4.4*var(--u)) calc(1.6*var(--u)) 0;box-shadow:inset 0 calc(1.2*var(--u)) 0 #B85A42;display:flex;flex-direction:column;align-items:center}
.sign{background:var(--paper);border:calc(.3*var(--u)) solid #3B2A4A;border-radius:calc(1.2*var(--u));padding:calc(1.6*var(--u)) calc(1.2*var(--u)) calc(1.6*var(--u));text-align:center;box-shadow:0 calc(.6*var(--u)) 0 #3B2A4A;width:100%}
.sign img{display:block;width:calc(13.5*var(--u));height:calc(13.5*var(--u));margin:0 auto;border-radius:calc(.5*var(--u))}
.sign p{font-family:var(--display);font-weight:800;font-size:calc(1.9*var(--u));line-height:1.08;margin:calc(1*var(--u)) 0 calc(.4*var(--u));color:#3B2A4A}
.sign small{display:block;font-size:calc(1.05*var(--u));font-weight:800;color:#5E4C70;overflow-wrap:anywhere}
/* "How to join": one plain step at a time, under the QR code */
.howto{margin-top:calc(1.4*var(--u));width:100%;background:var(--paper);border:calc(.3*var(--u)) solid #3B2A4A;border-radius:calc(1.2*var(--u));padding:calc(1.1*var(--u)) calc(1*var(--u)) calc(.9*var(--u));text-align:center;box-shadow:0 calc(.6*var(--u)) 0 #3B2A4A;color:#3B2A4A}
.howto-row{display:flex;align-items:center;justify-content:center;gap:calc(1*var(--u))}
.howto-num{display:grid;place-items:center;width:calc(3.6*var(--u));height:calc(3.6*var(--u));border-radius:50%;background:#FFC857;border:calc(.25*var(--u)) solid #3B2A4A;font-family:var(--display);font-weight:800;font-size:calc(2*var(--u));line-height:1}
.howto-num.tip{background:#BDEBD6;font-size:calc(1.8*var(--u))}
.howto-icon svg{display:block;width:calc(4.6*var(--u));height:calc(4.6*var(--u))}
.howto-text{font-family:var(--display);font-weight:800;font-size:calc(1.75*var(--u));line-height:1.12;margin:calc(.7*var(--u)) 0 calc(.6*var(--u));min-height:calc(3.9*var(--u));display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.howto-dots{display:flex;justify-content:center;gap:calc(.5*var(--u))}
.howto-dots span{width:calc(.8*var(--u));height:calc(.8*var(--u));border-radius:50%;background:#D8CFE6}
.howto-dots span.on{background:#3B2A4A}
.howto .fade{animation:howtoIn .45s ease both}
@keyframes howtoIn{from{opacity:0;transform:translateY(calc(.6*var(--u)))}to{opacity:1;transform:none}}
.howto-icon .bob{animation:howtoBob 1.1s ease-in-out infinite}
@keyframes howtoBob{50%{transform:translateY(calc(-.5*var(--u)))}}
@media (prefers-reduced-motion:reduce){.howto .fade,.howto-icon .bob{animation:none}}

/* the meadow along the bottom: the cat with the fiddle, latest names, the little dog */
.meadow{grid-column:1;grid-row:3;position:relative;z-index:2;display:flex;align-items:flex-end;gap:calc(2*var(--u));min-width:0}
.meadow .cat{width:calc(9.5*var(--u));flex-shrink:0;margin-left:calc(1*var(--u));position:relative}
.meadow .cat .haha{bottom:calc(8.6*var(--u));left:calc(6.8*var(--u))}
.cat.solo .c-bow{animation-duration:.13s}
.cat.solo svg{animation:jig .26s ease-in-out infinite alternate}
@keyframes jig{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(calc(-.4*var(--u)))}}
.note{position:absolute;left:60%;bottom:70%;font-family:var(--story);font-weight:700;font-size:calc(2.4*var(--u));color:#3B2A4A;opacity:0;pointer-events:none;animation:noteup 2s ease-out forwards}
@keyframes noteup{0%{opacity:0;transform:translate(0,0) rotate(-10deg)}15%{opacity:1}100%{opacity:0;transform:translate(var(--nx),calc(-6*var(--u))) rotate(14deg)}}
.shooting{position:absolute;top:calc(.4*var(--u));left:0;width:calc(16*var(--u));height:calc(2*var(--u));opacity:0;pointer-events:none;z-index:1}
.shooting::before{content:"";position:absolute;right:calc(1.2*var(--u));top:50%;width:100%;height:calc(.35*var(--u));margin-top:calc(-.18*var(--u));border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,246,200,.95))}
.shooting svg{position:absolute;right:0;top:50%;width:calc(2.6*var(--u));height:calc(2.6*var(--u));margin-top:calc(-1.3*var(--u))}
.shooting.go{animation:shoot 1.8s cubic-bezier(.3,.1,.6,1) forwards}
@keyframes shoot{0%{opacity:0;transform:translate(-20vw,0) rotate(3deg)}12%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(78vw,3vh) rotate(3deg)}}
.meadow .dog{width:calc(7.5*var(--u));flex-shrink:0;position:relative;margin-right:calc(1*var(--u))}
.meadow .haha{bottom:calc(8*var(--u));left:calc(-1*var(--u));font-size:calc(1.3*var(--u));border-width:calc(.2*var(--u))}
.runaway{bottom:calc(5.6*var(--u));left:0;width:calc(8*var(--u));z-index:1}
/* Baa Baa Black Sheep trots across, stops for a bleat, trots off */
.sheep{position:absolute;left:0;bottom:calc(1.2*var(--u));width:calc(12*var(--u));z-index:4;opacity:0;pointer-events:none;will-change:transform}
.sheep svg{display:block;width:100%;filter:drop-shadow(0 0 calc(.25*var(--u)) rgba(255,255,255,.5))}
.sheep.go{animation:trot 13s linear both}
@keyframes trot{0%{opacity:1;transform:translateX(-16vw)}38%{transform:translateX(40vw)}60%{transform:translateX(40vw)}99%{opacity:1;transform:translateX(112vw)}100%{opacity:0;transform:translateX(112vw)}}
.sheep .sh-legs-a,.sheep .sh-legs-b{transform-box:fill-box;transform-origin:50% 0;animation:step .2s ease-in-out infinite alternate}
.sheep .sh-legs-b{animation-delay:-.1s}
.sheep .sh-body{animation:bob .2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2%)}}
.sheep.stop .sh-legs-a,.sheep.stop .sh-legs-b,.sheep.stop .sh-body{animation-play-state:paused}
.sheep .sh-head{transform-box:fill-box;transform-origin:30% 80%}
.sheep.bleat .sh-head{animation:bleat .31s ease-in-out 4 alternate}
@keyframes bleat{to{transform:rotate(-12deg) translateY(-6%)}}
.sheep .haha{bottom:calc(10.5*var(--u));left:calc(6*var(--u));font-size:calc(1.3*var(--u));border-width:calc(.2*var(--u))}
/* latest names on bunting */
.bunting{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:calc(.8*var(--u));align-items:flex-start;margin-bottom:calc(1.4*var(--u));max-height:calc(4.2*var(--u));overflow:hidden}
.bunting span{font-family:var(--display);font-weight:800;font-size:calc(1.25*var(--u));color:#3B2A4A;background:var(--c);border:calc(.2*var(--u)) solid #3B2A4A;border-radius:calc(.6*var(--u));padding:calc(.4*var(--u)) calc(.9*var(--u));animation:hang 4s ease-in-out infinite;transform-origin:50% 0}
.bunting span:nth-child(2n){animation-delay:-1.5s}
.bunting .lead{background:transparent;border:0;padding:calc(.4*var(--u)) 0;color:#FFFDF6;animation:none;font-family:var(--ui);text-shadow:0 calc(.15*var(--u)) 0 #2C4A2A,0 0 calc(.5*var(--u)) #2C4A2A}
@keyframes hang{50%{transform:rotate(-3deg)}}

/* Wren's delivery flight */
.flier{position:absolute;width:calc(11*var(--u));z-index:5;left:calc(-14*var(--u));top:28%;pointer-events:none}
.flier.go{animation:deliver 2.2s cubic-bezier(.4,.1,.5,1) forwards}
@keyframes deliver{0%{transform:translate(0,0) rotate(6deg)}45%{transform:translate(50vw,-8vh) rotate(-4deg)}62%{transform:translate(62vw,6vh) rotate(4deg)}100%{transform:translate(118vw,-26vh) rotate(-10deg)}}
.spark{position:absolute;width:calc(1.4*var(--u));height:calc(1.4*var(--u));pointer-events:none;z-index:4;animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}

/* keep moving things on their own GPU layers so the browser doesn't repaint the whole screen */
body.tv-page{background-attachment:scroll}
.sky .cloud,.flier,.runaway,.moonbox .cow,.wallbox .humpty,.meadow .cat svg,.bunting span,.plate .ring,.plate .pic{will-change:transform}
.leaf-l.fwd-in,.leaf-r.fwd-out,.leaf-l.back-out,.leaf-r.back-in{will-change:transform}
body.tv-page.idle,body.tv-page.idle *{cursor:none !important}
.soundon{position:fixed;left:50%;bottom:calc(1.2*var(--u,1vw));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:.6em;font-family:var(--display);font-weight:800;font-size:calc(1.4*min(1vw,1.7778vh));color:#3B2A4A;background:var(--sun);border:calc(.25*min(1vw,1.7778vh)) solid #3B2A4A;border-radius:999px;padding:.55em 1.2em;box-shadow:0 .25em 0 #3B2A4A;animation:nudge 2.4s ease-in-out infinite;cursor:pointer}
.soundon svg{width:1.4em;height:1.4em}
.soundon[hidden]{display:none}
.soundon:focus{outline:calc(.35*min(1vw,1.7778vh)) solid #fff;outline-offset:calc(.3*min(1vw,1.7778vh))}
.toast{position:fixed;left:50%;bottom:calc(1.4*min(1vw,1.7778vh));transform:translate(-50%,150%);z-index:10;font-family:var(--display);font-weight:800;font-size:calc(1.3*min(1vw,1.7778vh));color:#3B2A4A;background:var(--mint);border:calc(.25*min(1vw,1.7778vh)) solid #3B2A4A;border-radius:999px;padding:.5em 1.2em;transition:transform .4s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
@keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-.25em)}}
.tools .btn[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
.tools{position:fixed;left:1vw;top:1vh;display:flex;gap:.5vw;opacity:0;transition:opacity .3s;z-index:9}
.tools:hover,.tools:focus-within{opacity:1}
.offline{position:fixed;right:1vw;bottom:1vh;font-size:1vw;font-weight:800;background:#B3263E;color:#fff;padding:.5vh .9vw;border-radius:99px;z-index:9}
</style>
</head>
<body class="tv-page">
<main class="tv">
  <div class="sky"><div class="stars" id="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="shooting" id="shooting"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0l2.6 7.4L20 10l-7.4 2.6L10 20l-2.6-7.4L0 10l7.4-2.6z" fill="#FFE9A0" stroke="#3B2A4A" stroke-width="1.2"/></svg></div></div>
  <div class="ground" id="ground"></div>

  <header class="head">
    <h1 class="title" id="title">A storybook for our little one</h1>
  </header>
  <div class="moonbox" id="moonbox">
    <div class="moon" aria-live="polite"><div><b id="count">0</b><span id="count-label">pages so far</span></div></div>
    <div class="cow" id="cow"></div>
    <div class="haha diddle" id="diddle"></div>
  </div>

  <div class="book-wrap" id="book-wrap">
    <div class="spread" id="spread">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="bookmark" aria-hidden="true"></span>
      <div class="leaf leaf-l" id="left"></div>
      <div class="leaf leaf-r" id="right" aria-live="polite"></div>
      <button class="nav prev" id="prev" aria-label="Previous page" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav next" id="next" aria-label="Next page" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>

  <div class="wallbox">
    <div class="humpty" id="humpty"></div>
    <div class="wall brick">
      <div class="sign">
        <img src="/api/qr.svg" alt="QR code linking to the page-writing form">
        <p id="qr-label"></p>
        <small id="url"></small>
      </div>
      <div class="howto" id="howto" aria-live="polite">
        <div class="howto-row">
          <span class="howto-num" id="howto-num">1</span>
          <span class="howto-icon" id="howto-icon" aria-hidden="true"></span>
        </div>
        <p class="howto-text" id="howto-text"></p>
        <div class="howto-dots" id="howto-dots" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <div class="meadow">
    <div class="cat" id="cat"></div>
    <div class="bunting" id="bunting"></div>
    <div class="dog" id="dog"><div class="haha" id="haha"></div></div>
  </div>
  <div class="runaway" id="runaway"></div>
  <div class="sheep" id="sheep"></div>
  <div class="flier" id="flier"></div>
</main>
<div class="tools"><button class="btn btn-soft" id="fs">Full screen (F)</button><button class="btn btn-soft" id="music-btn">Music (M)</button><button class="btn btn-soft" id="sfx-btn">Sounds (S)</button></div>
<div class="toast" id="toast" role="status"></div>
<button class="soundon" id="soundon" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5q2 3.5 0 7M18.5 6q4 6 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Click to turn on sound</button>
<div class="offline hidden" id="offline">Reconnecting…</div>
<script src="/shared.js"></script>
<script src="/sound.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  // Each theme can swap a sound for another (or silence) so no animal makes the wrong noise.
  const sfx = (n, a) => { const m = N18.SOUNDS && (n in N18.SOUNDS) ? N18.SOUNDS[n] : n; if(m && window.N18Sound) N18Sound.play(m, a); };
  // The TV is a shared party display, so it always animates, whatever the computer driving it is set to.
  const reduce = false;
  const AUTO_MS = 12000;        // time on each page while nobody is browsing
  const BROWSE_PAUSE_MS = 30000; // after someone flips pages, wait this long before auto-turning again
  let notes = [], known = new Set(), first = true;
  let idx = -1, busy = false, nextTurn = Date.now() + 12000, lastTitle = "", queue = [];

  // scenery
  $("ground").innerHTML = N18.hills();
  $("flier").innerHTML = N18.BIRD;
  $("humpty").innerHTML = N18.HUMPTY;
  $("cow").innerHTML = N18.COW;
  $("cat").innerHTML = N18.CAT + '<div class="haha" id="meow"></div>';
  $("dog").insertAdjacentHTML("afterbegin", N18.DOG);
  $("runaway").innerHTML = N18.DISHSPOON;
  $("sheep").innerHTML = N18.SHEEP + '<div class="haha" id="baa"></div>';
  $("diddle").textContent = N18.SAY.jump; $("haha").textContent = N18.SAY.laugh; $("meow").textContent = N18.SAY.song; $("baa").textContent = N18.SAY.walk;

  // Hey diddle diddle: the cow jumps over the moon and the little dog laughs.
  const cow = $("cow");
  function setCowPath(){
    const u = Math.min(innerWidth/100, innerHeight/56.25);
    cow.style.setProperty("--x0", (-14*u)+"px"); cow.style.setProperty("--x1", (12*u)+"px");
    cow.style.setProperty("--y0", (5*u)+"px"); cow.style.setProperty("--ytop", (-3.2*u)+"px");
  }
  setCowPath(); addEventListener("resize", setCowPath);
  function diddle(){
    cow.classList.remove("jump"); void cow.offsetWidth; cow.classList.add("jump");
    sfx("moo"); setTimeout(()=>sfx("boing"), 450); setTimeout(()=>sfx("haha"), 1250);
    $("diddle").classList.add("show"); setTimeout(()=>$("diddle").classList.remove("show"), 2400);
    setTimeout(()=>{ $("dog").classList.add("laugh"); $("haha").classList.add("show"); }, 1200);
    setTimeout(()=>{ $("dog").classList.remove("laugh"); $("haha").classList.remove("show"); }, 3600);
  }
  // The cat plays a jig (music notes float up), meows; the dog barks; a shooting star crosses the sky.
  function fiddle(){
    const c = $("cat"); c.classList.add("solo"); sfx("fiddle");
    ["\u266A","\u266B","\u266A","\u266B"].forEach((ch, i)=>setTimeout(()=>{
      const n = document.createElement("span"); n.className = "note"; n.textContent = ch;
      n.style.setProperty("--nx", ((i % 2 ? 1 : -1) * (1 + Math.random()*2)) + "vw"); c.append(n); setTimeout(()=>n.remove(), 2100);
    }, i * 550));
    setTimeout(()=>c.classList.remove("solo"), 2600);
  }
  function meow(){ sfx("meow"); $("meow").classList.add("show"); setTimeout(()=>$("meow").classList.remove("show"), 2200); }
  function woof(){
    sfx("woof"); $("haha").textContent = N18.SAY.bark;
    $("dog").classList.add("laugh"); $("haha").classList.add("show");
    setTimeout(()=>{ $("dog").classList.remove("laugh"); $("haha").classList.remove("show"); }, 1800);
    setTimeout(()=>{ $("haha").textContent = N18.SAY.laugh; }, 2200);
  }
  function shootingStar(){ const st = $("shooting"); st.classList.remove("go"); void st.offsetWidth; st.classList.add("go"); setTimeout(()=>sfx("twinkle"), 200); }
  // Baa Baa Black Sheep: trots in with three bags full, stops for a "baa baa", trots off.
  let sheepBusy = false;
  function sheepWalk(){
    if(sheepBusy) return; sheepBusy = true;
    const sh = $("sheep"); sh.classList.remove("go","stop","bleat"); void sh.offsetWidth; sh.classList.add("go");
    setTimeout(()=>{ sh.classList.add("stop"); }, 13000 * 0.38);
    setTimeout(()=>{ sh.classList.add("bleat"); $("baa").classList.add("show"); sfx("baa"); }, 13000 * 0.38 + 350);
    setTimeout(()=>{ sh.classList.remove("bleat"); $("baa").classList.remove("show"); }, 13000 * 0.38 + 2000);
    setTimeout(()=>{ sh.classList.remove("stop"); }, 13000 * 0.60);
    setTimeout(()=>{ sh.classList.remove("go"); sheepBusy = false; }, 13200);
  }
  // ...and the dish ran away with the spoon.
  function runaway(){ const r = $("runaway"); r.classList.remove("go"); void r.offsetWidth; r.classList.add("go"); setTimeout(()=>sfx("clinks"), 1200); }
  function whoa(quiet){ if(!quiet) sfx("wobble"); const h = $("humpty"); h.classList.remove("whoa"); void h.offsetWidth; h.classList.add("whoa"); setTimeout(()=>h.classList.remove("whoa"), 1700); }
  if(!reduce){
  }
  if(document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches)) for(let i=0;i<24;i++){ const s=document.createElement("span"); s.className="star"; s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*60+"%"; s.style.animationDelay=(Math.random()*3)+"s"; $("stars").append(s); }
  fetch("/api/guest-url").then(r=>r.json()).then(j=>{ $("url").textContent = j.url.replace(/^https?:\/\//,"").replace(/\/$/,""); }).catch(()=>{});

  // ---- "How to join" steps under the QR code ----
  const HOWTO_ICONS = [
    // 1 camera
    '<svg viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="26" rx="6" fill="#AFCBF2" stroke="#3B2A4A" stroke-width="3"/><path d="M17 14l3-5h8l3 5" fill="#AFCBF2" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="27" r="7" fill="#fff" stroke="#3B2A4A" stroke-width="3"/><circle cx="24" cy="27" r="3" fill="#3B2A4A"/></svg>',
    // 2 phone pointing up at the code
    '<svg viewBox="0 0 48 48"><g class="bob"><path d="M24 4l-6 7h4v6h4v-6h4z" fill="#E0607E" stroke="#3B2A4A" stroke-width="2.4" stroke-linejoin="round"/></g><rect x="14" y="19" width="20" height="26" rx="4" fill="#fff" stroke="#3B2A4A" stroke-width="3"/><rect x="18" y="24" width="12" height="12" fill="#3B2A4A"/><rect x="21" y="27" width="3" height="3" fill="#fff"/><rect x="25" y="31" width="2" height="2" fill="#fff"/></svg>',
    // 3 tap the link
    '<svg viewBox="0 0 48 48"><rect x="6" y="8" width="36" height="14" rx="7" fill="#FFE39A" stroke="#3B2A4A" stroke-width="3"/><path d="M13 15h16" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round"/><g class="bob"><path d="M26 44V28a3 3 0 0 1 6 0v8l6 1.5a3 3 0 0 1 2 3.4L38.6 44z" fill="#F5D6BF" stroke="#3B2A4A" stroke-width="2.6" stroke-linejoin="round"/></g></svg>',
    // 4 write
    '<svg viewBox="0 0 48 48"><rect x="7" y="7" width="28" height="34" rx="4" fill="#fff" stroke="#3B2A4A" stroke-width="3"/><path d="M13 16h16M13 23h16M13 30h9" stroke="#C9BEDC" stroke-width="3" stroke-linecap="round"/><g class="bob"><path d="M28 38l14-14 4 4-14 14-6 2z" fill="#FFC857" stroke="#3B2A4A" stroke-width="2.6" stroke-linejoin="round"/></g></svg>',
    // 5 on the TV
    '<svg viewBox="0 0 48 48"><rect x="4" y="9" width="40" height="27" rx="4" fill="#AFCBF2" stroke="#3B2A4A" stroke-width="3"/><path d="M18 41h12M24 36v5" stroke="#3B2A4A" stroke-width="3" stroke-linecap="round"/><g class="bob"><path d="M24 15l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#FFC857" stroke="#3B2A4A" stroke-width="2" stroke-linejoin="round"/></g></svg>',
    // tip: type the address
    '<svg viewBox="0 0 48 48"><rect x="14" y="4" width="22" height="40" rx="5" fill="#fff" stroke="#3B2A4A" stroke-width="3"/><rect x="18" y="10" width="14" height="6" rx="2" fill="#BDEBD6" stroke="#3B2A4A" stroke-width="2"/><path d="M19 24h4M25 24h4M19 30h4M25 30h4M19 36h10" stroke="#3B2A4A" stroke-width="2.6" stroke-linecap="round"/></svg>'
  ];
  const HOWTO_MS = [4500, 4500, 4000, 4500, 4500, 6000];
  let howtoStep = 0;
  $("howto-dots").innerHTML = HOWTO_ICONS.slice(0, 5).map(() => "<span></span>").join("");
  function showHowto(){
    const i = howtoStep, tip = i === 5;
    const num = $("howto-num"), icon = $("howto-icon"), text = $("howto-text");
    num.textContent = tip ? "?" : String(i + 1);
    num.classList.toggle("tip", tip);
    icon.innerHTML = HOWTO_ICONS[i];
    text.textContent = N18.t("howto" + (i + 1));
    [num, icon, text].forEach(el => { el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); });
    [...$("howto-dots").children].forEach((d, n) => d.classList.toggle("on", n === i));
    setTimeout(() => { howtoStep = (howtoStep + 1) % HOWTO_ICONS.length; showHowto(); }, HOWTO_MS[i]);
  }
  showHowto();

  function headings(s){
    // The host changed the theme: reload to pick up the new animals and colours.
    const root = document.documentElement;
    if(s.theme && root.dataset.look && s.theme !== root.dataset.look){ location.reload(); return; }
    N18.apply(s);
    const t = N18.t("tvTitle");
    if(t !== lastTitle){ lastTitle = t; N18.bounceText($("title"), t); }
    document.title = t;
    const q = N18.t("qrLabel"); if($("qr-label").textContent !== q) $("qr-label").textContent = q;
    const words = JSON.stringify(s.text || {}) + (s.name || "");
    if(lastWords !== null && words !== lastWords && idx >= 0 && notes[idx]) fill(idx, false); else if(lastWords !== null && words !== lastWords && idx === -1) renderEmpty();
    lastWords = words;
  }
  let lastWords = null;

  const sizeClass = t => t.length > 250 ? "xlong" : t.length > 130 ? "long" : t.length < 60 ? "short" : "";

  const SPARK = '<svg viewBox="0 0 20 20"><path d="M10 0l2.6 7.4L20 10l-7.4 2.6L10 20l-2.6-7.4L0 10l7.4-2.6z" fill="#FFE08A" stroke="#3B2A4A" stroke-width="1.4"/></svg>';
  const FLOURISH = '<svg class="flourish" viewBox="0 0 140 20" aria-hidden="true"><path d="M4 10 C24 2 38 18 58 10 M136 10 C116 2 102 18 82 10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M70 3 l5 7 -5 7 -5 -7z" fill="currentColor" stroke="#3B2A4A" stroke-width="1.4"/></svg>';
  function pageParts(kind){
    const L = $("left"), R = $("right");
    L.className = "leaf leaf-l k-" + kind; R.className = "leaf leaf-r k-" + kind;
    const li = document.createElement("div"); li.className = "leaf-inner";
    const ri = document.createElement("div"); ri.className = "leaf-inner";
    L.replaceChildren(li); R.replaceChildren(ri);
    return [L, R, li, ri];
  }
  function plate(kind){
    const pl = document.createElement("div"); pl.className = "plate";
    pl.innerHTML = '<div class="ring"></div><div class="pic">' + N18.ICONS[kind] + '</div>' + ["a","b","c","d"].map(x => '<span class="tw ' + x + '">' + SPARK + '</span>').join("");
    return pl;
  }
  function fill(i, fresh){
    const note = notes[i]; if(!note) return;
    idx = i;
    const k = N18.kindOf(note.kind);
    const [L, R, li, ri] = pageParts(k);

    const no = document.createElement("p"); no.className = "chapter-no"; no.textContent = "Page " + (i+1) + " of " + notes.length;
    const bn = document.createElement("h2"); bn.className = "banner"; bn.textContent = N18.label(k);
    li.append(no, plate(k), bn);

    const story = document.createElement("p"); story.className = "story " + sizeClass(note.text);
    const chars = Array.from(note.text);
    if(/[A-Za-z0-9]/.test(chars[0] || "") && chars.length >= 60){ const d = document.createElement("span"); d.className = "drop"; d.textContent = chars.shift(); story.append(d); }
    story.append(document.createTextNode(chars.join("")));
    const sig = document.createElement("p"); sig.className = "sig"; sig.textContent = N18.t("signOff");
    const nm = document.createElement("b"); nm.textContent = note.from || "a guest"; sig.append(nm);
    ri.append(story); ri.insertAdjacentHTML("beforeend", FLOURISH); ri.append(sig);
    const pn = document.createElement("span"); pn.className = "page-no"; pn.textContent = "~ " + (i+1) + " ~"; R.append(pn);
    fitStory(ri, story);
    if(fresh){ const rb = document.createElement("div"); rb.className = "ribbon"; rb.textContent = "New page!"; L.append(rb); }
    $("prev").hidden = $("next").hidden = notes.length < 2;
    renderBunting();
  }

  // Shrink a long message until the message, flourish and signature all fit the page on this screen.
  function fitStory(inner, story){
    const cs = getComputedStyle(inner);
    const avail = inner.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const used = () => Array.from(inner.children).reduce((h, el) => { const m = getComputedStyle(el); return h + el.offsetHeight + parseFloat(m.marginTop) + parseFloat(m.marginBottom); }, 0);
    let fs = parseFloat(getComputedStyle(story).fontSize); const min = fs * 0.45;
    while(used() > avail && fs > min){ fs *= 0.94; story.style.fontSize = fs + "px"; }
  }
  let rz = null;
  addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ if(idx >= 0 && !busy) fill(idx, false); }, 250); });

  // Turn to page i. dir = 1 (forward) or -1 (backward).
  function turnTo(i, dir, fresh, done, quiet){
    if(reduce || idx < 0){ fill(i, fresh); done && done(); return; }
    busy = true;
    const out = dir > 0 ? $("right") : $("left");
    out.classList.add(dir > 0 ? "fwd-out" : "back-out");
    if(!quiet) sfx("whoosh", !fresh);
    setTimeout(()=>{
      fill(i, fresh);
      const inn = dir > 0 ? $("left") : $("right");
      inn.classList.add(dir > 0 ? "fwd-in" : "back-in");
      setTimeout(()=>{ busy = false; done && done(); afterBusy(); }, 520);
    }, 450);
  }

  // A brand-new page: Wren flies it in, then the book turns straight to it.
  function deliver(id){
    const i = notes.findIndex(n=>n.id===id); if(i < 0){ afterBusy(); return; }
    nextTurn = Date.now() + AUTO_MS + 2500; // let everyone read it
    if(typeof nextMoment !== "undefined") nextMoment = Math.max(nextMoment, Date.now() + 15000);
    if(reduce){ fill(i, true); afterBusy(); return; }
    busy = true;
    const f = $("flier"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    sfx("tweet");
    setTimeout(()=>{ sparkle(); busy = false; turnTo(i, 1, true); }, 1250);
    setTimeout(()=>f.classList.remove("go"), 2300);
  }

  // New pages always jump the queue, even if someone is browsing.
  function afterBusy(){ if(!busy && queue.length) setTimeout(()=>{ if(!busy && queue.length) deliver(queue.shift()); }, 900); }

  function go(step, byHand){
    if(notes.length < 2) return;
    nextTurn = Date.now() + (byHand ? BROWSE_PAUSE_MS : AUTO_MS);
    if(busy || queue.length) return;
    const n = notes.length, target = ((idx + step) % n + n) % n;
    turnTo(target, step, false, null, !byHand);
  }

  function sparkle(){
    sfx("chime");
    const wrap = $("spread").getBoundingClientRect();
    const colors = ["#FFC857","#FF9FB2","#8FD3B6","#C9B8F5","#FFFFFF"];
    for(let i=0;i<18;i++){
      const s = document.createElement("span"); s.className = "spark";
      s.innerHTML = `<svg viewBox="0 0 20 20"><path d="M10 0l2.6 7.4L20 10l-7.4 2.6L10 20l-2.6-7.4L0 10l7.4-2.6z" fill="${colors[i%colors.length]}" stroke="#3B2A4A" stroke-width="1"/></svg>`;
      s.style.left = (wrap.left + wrap.width*0.75) + "px"; s.style.top = (wrap.top + wrap.height*0.3) + "px";
      const a = Math.random()*Math.PI*2, r = 8 + Math.random()*14;
      s.style.setProperty("--dx", Math.cos(a)*r + "vw"); s.style.setProperty("--dy", Math.sin(a)*r + "vh");
      document.querySelector(".tv").append(s); setTimeout(()=>s.remove(), 1500);
    }
    const mb = $("moonbox"); mb.classList.remove("bump"); void mb.offsetWidth; mb.classList.add("bump");
    whoa(true);
  }

  let buntingKey = "";
  function renderBunting(){
    const latest = notes.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);
    const key = latest.map(n=>n.id + "|" + n.from).join(",");
    if(key === buntingKey) return; buntingKey = key;
    const nodes = [];
    if(latest.length){ const l = document.createElement("span"); l.className = "lead"; l.textContent = "Latest pages from"; nodes.push(l); }
    latest.forEach(n=>{ const s = document.createElement("span"); s.className = "k-" + N18.kindOf(n.kind); s.textContent = (n.from || "A guest").split(/[,(]/)[0].trim().slice(0,16) || "A guest"; nodes.push(s); });
    $("bunting").replaceChildren(...nodes);
  }

  function renderEmpty(){
    idx = -1;
    const [L, R, li, ri] = pageParts("wish");
    li.innerHTML = '<p class="chapter-no">Page 1</p>'; li.append(plate("wish")); const bn = document.createElement("h2"); bn.className = "banner"; bn.textContent = N18.t("emptyBanner"); li.append(bn);
    const et = N18.t("emptyText");
    ri.innerHTML = '<p class="story long"><span class="drop"></span><span class="rest"></span></p>' + FLOURISH + '<p class="sig">Waiting for<b>page one</b></p>';
    ri.querySelector(".drop").textContent = et.charAt(0); ri.querySelector(".rest").textContent = et.slice(1);
    fitStory(ri, ri.querySelector(".story"));
    $("prev").hidden = $("next").hidden = true;
    renderBunting();
  }


  async function poll(){
    try{
      const r = await fetch("/api/state", { cache:"no-store" });
      if(!r.ok) throw new Error();
      const j = await r.json();
      $("offline").classList.add("hidden");
      headings(j.settings || {});
      applyHostSound(j.settings || {});
      const currentId = idx >= 0 && notes[idx] ? notes[idx].id : null;
      notes = (j.notes || []).slice().sort((a,b)=>a.createdAt-b.createdAt);
      $("count").textContent = notes.length;
      $("count-label").textContent = notes.length === 1 ? "page so far" : "pages so far";
      const added = notes.filter(n=>!known.has(n.id)).map(n=>n.id);
      known = new Set(notes.map(n=>n.id));

      if(first){
        first = false;
        if(notes.length) fill(0, false); else renderEmpty();
      } else if(!notes.length){
        if(idx !== -1) renderEmpty();
      } else if(added.length){
        queue.push(...added);
        if(idx < 0) fill(0, false);
        else { const keep = notes.findIndex(n=>n.id===currentId); if(keep >= 0) idx = keep; }
        if(!busy) deliver(queue.shift());
      } else {
        // a page may have been removed on the host page
        const keep = notes.findIndex(n=>n.id===currentId);
        if(keep < 0){ if(!busy) fill(Math.min(Math.max(idx,0), notes.length-1), false); }
        else if(keep !== idx){ idx = keep; if(!busy) fill(idx, false); }
        else { const cn = $("left").querySelector(".chapter-no"), t = "Page " + (idx+1) + " of " + notes.length; if(cn && cn.textContent !== t) cn.textContent = t; renderBunting(); }
      }
    }catch(e){ $("offline").classList.remove("hidden"); }
    setTimeout(poll, 2000);
  }

  // Browsing: arrow buttons, TV-remote / keyboard arrows, and swipes.
  $("prev").addEventListener("click", ()=>go(-1, true));
  $("next").addEventListener("click", ()=>go(1, true));
  addEventListener("keydown", e=>{
    if(["ArrowRight","PageDown"," ","Enter"].includes(e.key) && e.target === document.body){ e.preventDefault(); go(1, true); }
    else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(-1, true); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); go(1, true); }
  });
  let sx = null;
  $("spread").addEventListener("pointerdown", e=>{ sx = e.clientX; });
  $("spread").addEventListener("pointerup", e=>{ if(sx === null) return; const dx = e.clientX - sx; sx = null; if(Math.abs(dx) > 50) go(dx < 0 ? 1 : -1, true); });

  headings({});
  poll();
  // ---- one quiet clock for the animations and the automatic page turns ----
  const T0 = Date.now();
  // Characters take turns: one little moment at a time, picked at random, about every fxGap seconds.
  const MOMENTS = [
    { name:"cow",    run:diddle },
    { name:"dish",   run:runaway },
    { name:"humpty", run:()=>whoa() },
    { name:"fiddle", run:fiddle },
    { name:"meow",   run:meow },
    { name:"woof",   run:woof },
    { name:"star",   run:shootingStar },
    { name:"sheep",  run:sheepWalk }
  ];
  let fxGap = 45000, nextMoment = T0 + 8000, recent = [];
  window.__n18moment = name => { const m = MOMENTS.find(x => x.name === name); if(m) m.run(); }; // handy for testing
  function planNext(from){ nextMoment = from + fxGap * (0.8 + Math.random() * 0.4); }
  function setFxGap(sec){ const g = Math.max(10, Number(sec) || 45) * 1000; if(g !== fxGap){ fxGap = g; planNext(Date.now()); } }
  function schedule(){
    if(document.hidden) return;
    const now = Date.now();
    if(now >= nextMoment && !busy){
      const pool = MOMENTS.filter(m => !recent.includes(m.name));
      const m = pool[Math.floor(Math.random() * pool.length)];
      m.run(); recent.push(m.name); if(recent.length > 3) recent.shift();
      planNext(now);
    }
    if(notes.length >= 2 && now >= nextTurn && !busy && !queue.length){ nextTurn = now + AUTO_MS; go(1, false); }
  }
  setInterval(schedule, 500);

  async function toggleFull(){
    try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
    catch(e){ $("fs").textContent = "Press F11 for full screen"; }
  }
  $("fs").addEventListener("click", toggleFull);

  // ---- sound: one click or key press unlocks it (browser rule), M and S toggle music and effects ----
  const S = window.N18Sound;
  if(S) S.onSong = name => { if(/Black Sheep/.test(name)) sheepWalk(); };
  function syncSoundUI(){
    if(!S) return;
    $("music-btn").setAttribute("aria-pressed", String(S.music));
    $("sfx-btn").setAttribute("aria-pressed", String(S.sfx));
    $("soundon").hidden = S.ready || (!S.music && !S.sfx);
  }
  function unlockSound(){
    if(!S) return;
    const was = S.ready; S.unlock(); syncSoundUI();
    if(!was) setTimeout(()=>toast(S.engine === "simple" ? "Sound is on (simple mode for this TV)" : "Sound is on"), 1100);
  }
  // TV remotes send different events on different models, so listen for all of them.
  ["pointerdown","mousedown","touchend","click","keydown","keyup"].forEach(ev => addEventListener(ev, unlockSound, true));
  // Put the remote's focus on the sound button so pressing OK turns sound on.
  setTimeout(()=>{ try{ if(S && !S.ready) $("soundon").focus(); }catch(e){} }, 800);
  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 3500);
  }
  $("music-btn").addEventListener("click", ()=>{ S.setMusic(!S.music); syncSoundUI(); });
  $("sfx-btn").addEventListener("click", ()=>{ S.setSfx(!S.sfx); syncSoundUI(); });
  addEventListener("keydown", e=>{
    if(!S) return;
    if(e.key === "m" || e.key === "M"){ S.setMusic(!S.music); syncSoundUI(); }
    if(e.key === "s" || e.key === "S"){ S.setSfx(!S.sfx); syncSoundUI(); }
  });
  syncSoundUI();

  // The host page can switch music / effects / volume and send a test chime.
  // Local M and S keys still work; the host's settings win whenever they change.
  let hostSound = null;
  function applyHostSound(st){
    if(!S) return;
    const key = [st.music, st.sfx, st.volume, st.soundmode, st.fxgap].join("|");
    if(key !== hostSound){
      const first = hostSound === null; hostSound = key;
      if(st.music) S.setMusic(st.music !== "off");
      if(st.sfx) S.setSfx(st.sfx !== "off");
      if(st.volume !== undefined) S.setVolume(Number(st.volume) / 100);
      if(st.soundmode) S.setMode(st.soundmode);
      if(st.fxgap) setFxGap(st.fxgap);
      syncSoundUI();
    }
    if(st.ping && st.ping !== "0"){
      if(lastPing !== null && st.ping !== lastPing) sfx("chime");
      lastPing = st.ping;
    } else if(lastPing === null) lastPing = st.ping || "0";
  }
  let lastPing = null;
  addEventListener("keydown", e=>{ if(e.key === "f" || e.key === "F"){ e.preventDefault(); toggleFull(); } });
  document.querySelector(".head").addEventListener("dblclick", toggleFull);

  // hide the mouse pointer when it hasn't moved for a few seconds
  let idleT = null;
  addEventListener("mousemove", ()=>{ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(()=>document.body.classList.add("idle"), 3000); });
  idleT = setTimeout(()=>document.body.classList.add("idle"), 3000);

  // stop the laptop's screen going to sleep during the party (supported in Chrome and Edge)
  let lock = null;
  async function keepAwake(){ try{ if("wakeLock" in navigator && !document.hidden) lock = await navigator.wakeLock.request("screen"); }catch(e){} }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) keepAwake(); });
  keepAwake();
})();
</script>
